[package]
name = "claude_parser"
version = "1.0.5"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvio/ruv.io"
description = "Stream-JSON parser for Claude Code CLI with napi-rs bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "2.16"
napi-derive = "2.16"
serde_json = "1.0"
claude-parser = "1.0.5"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
opt-level = 3
strip = true
