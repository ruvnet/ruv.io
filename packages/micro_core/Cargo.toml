[package]
name = "micro_core"
version = "0.2.0"
edition = "2021"
description = "NAPI-RS bindings for micro_core Rust crate - Core no_std Semantic Cartan Matrix implementation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv.io"
homepage = "https://ruv.io"
authors = ["rUv <support@ruv.io>"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde_json = "1"

[build-dependencies]
napi-build = "2.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 3
