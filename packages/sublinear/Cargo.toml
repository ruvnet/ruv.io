[package]
name = "sublinear"
version = "1.0.0"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvio/ruv.io"
description = "High-performance sublinear-time solver for asymmetric diagonally dominant systems with napi-rs bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"
