[package]
name = "geometric_langlands"
version = "0.2.2"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvio/ruv.io"
description = "Geometric Langlands - A comprehensive computational framework for the Geometric Langlands Conjecture with napi-rs bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"
