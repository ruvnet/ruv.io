[package]
name = "aimds_detection"
version = "1.0.0"
edition = "2021"
description = "Real-time detection functionality for AIMDS - NAPI bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv.io"
homepage = "https://ruv.io"
authors = ["rUv <support@ruv.io>"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
napi-build = "2.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 3
