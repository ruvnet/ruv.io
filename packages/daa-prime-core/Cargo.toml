[package]
name = "daa_prime_core"
version = "0.2.1"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvnet/ruv.io"
description = "Core shared structures and protocol definitions for Prime distributed ML framework"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[build-dependencies]
napi-build = "2.1"
