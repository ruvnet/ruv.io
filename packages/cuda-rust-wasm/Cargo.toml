[package]
name = "cuda_rust_wasm"
version = "0.1.6"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvio/ruv.io"
description = "CUDA to Rust transpiler with WebGPU/WASM support"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi6"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"
