[package]
name = "qudag_protocol"
version = "0.5.0"
edition = "2021"
description = "NAPI-RS bindings for qudag-protocol Rust crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv.io"
homepage = "https://ruv.io"
authors = ["rUv <support@ruv.io>"]

[dependencies]
napi = { version = "2.16", features = ["serde-json", "tokio_rt"] }
napi-derive = "2.16"
qudag-protocol = "0.5"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 3
