[package]
name = "daa_prime_cli"
version = "1.0.0"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvnet/ruv.io"
description = "CLI interface for DAA Prime (Decentralized Autonomous Agents) with napi-rs bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "2.16"
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
shlex = "1.1"

[build-dependencies]
napi-build = "2.1"
