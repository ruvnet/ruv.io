[package]
name = "aimds_analysis"
version = "0.1.0"
edition = "2021"
description = "NAPI-RS bindings for aimds-analysis Rust crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv.io"
homepage = "https://ruv.io"
authors = ["rUv <support@ruv.io>"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"

[build-dependencies]
napi-build = "2.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 3
