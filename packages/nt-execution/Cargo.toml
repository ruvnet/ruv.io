[package]
name = "nt_execution"
version = "1.0.0"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvnet/ruv.io"
description = "Order execution engine for Neural Trader - A high-performance algorithmic trading platform with napi-rs bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "2.16"
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
opt-level = 3
strip = true
