[package]
name = "nt_market_data"
version = "1.0.0"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvio/ruv.io"
description = "Market data management for Neural Trader - Real-time and historical data ingestion, caching, and normalization with napi-rs bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "2.16"
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"
