[package]
name = "code_mesh_cli"
version = "1.0.0"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvio/ruv.io"
description = "CLI for Code Mesh - high-performance command-line tools for mesh management, command execution, and visualization"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
once_cell = "1.19"
rayon = "1.7"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
napi-build = "2.1"
