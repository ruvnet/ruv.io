[package]
name = "ruv_fann"
version = "0.1.6"
edition = "2021"
description = "NAPI-RS bindings for ruv-fann Rust crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv.io"
homepage = "https://ruv.io"
authors = ["rUv <support@ruv.io>"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
ruv-fann = "0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
napi-build = "2.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 3
