[package]
name = "opencv_core"
version = "4.8.1"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvio/ruv.io"
description = "OpenCV Core module - fundamental data structures and operations with napi-rs bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opencv-core = "4.8"

[build-dependencies]
napi-build = "2.1"
