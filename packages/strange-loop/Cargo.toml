[package]
name = "strange_loop"
version = "0.3.0"
edition = "2021"
authors = ["ruv.io team"]
license = "MIT"
repository = "https://github.com/ruvnet/ruv.io"
description = "Hyper-optimized strange loops with temporal consciousness and quantum-classical hybrid computing"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
once_cell = "1.19"
rayon = "1.7"

[build-dependencies]
napi-build = "2.1"
